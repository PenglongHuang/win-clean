<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>win-clean · 清理完成报告</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#14161f; color:#cfd3dc; }
  header { padding:14px 20px; background:#1b1e2b; border-bottom:1px solid #2a2e3d; }
  header h1 { font-size:18px; margin:0 0 4px; }
  header .sub { color:#8a8f9e; font-size:12px; }
  main { padding:16px 20px; max-width:1000px; margin:0 auto; }
  .stats { display:flex; gap:10px; margin-bottom:14px; }
  .stat { flex:1; background:#1e2230; border-radius:8px; padding:12px; text-align:center; }
  .stat b { font-size:24px; display:block; color:#5dd18b; }
  .stat span { font-size:12px; color:#8a8f9e; }
  .panel { background:#1e2230; border-radius:8px; padding:12px 16px; margin-bottom:12px; }
  .panel h3 { margin:0 0 8px; font-size:14px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; }
  .bar-row .track { flex:1; height:10px; background:#2a2e3d; border-radius:5px; overflow:hidden; position:relative; }
  .bar-row .before { height:100%; background:#e0a55d; float:left; }
  .bar-row .freed { position:absolute; top:0; right:0; height:100%; background:#5dd18b; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { padding:5px 8px; border-bottom:1px solid #2a2e3d; text-align:left; }
  .num { text-align:right; color:#5dd18b; }
  .warn { color:#e0c55d; }
  .session-row { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid #2a2e3d; font-size:13px; }

  body{background:radial-gradient(ellipse at top left,rgba(21,105,79,.18),transparent 38%),#0b0d13;color:#eef1f6;min-height:100vh;padding:22px;font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif}
  header,main{max-width:1036px;margin:auto}header{border:1px solid #333e49;border-radius:16px;background:#111721;padding:17px 20px}header .sub,.stat span{color:#b5bfcc}main{padding:16px 0}.stats{gap:14px}.stat,.panel{background:#1b222b;border:1px solid #343e4a;border-radius:16px;padding:20px}.stat{text-align:left}.stat:first-child{background:linear-gradient(130deg,rgba(27,75,61,.6),#1b222b)}.stat b{font-size:30px;color:#70deb6}.panel h3{font-size:16px}.panel{overflow:auto}td,th{padding:10px 8px}.num{color:#70deb6}@media(max-width:720px){body{padding:12px}.stats{flex-wrap:wrap}.stat{min-width:130px}.panel{padding:14px}table{min-width:500px}}
</style>
</head>
<body>
<header>
  <h1>🧹 win-clean 清理完成报告</h1>
  <div class="sub" id="hd-sub"></div>
</header>
<main>
  <div class="stats">
    <div class="stat"><b id="st-freed">—</b><span>本次释放</span></div>
    <div class="stat"><b id="st-total">—</b><span>累计释放</span></div>
    <div class="stat"><b id="st-count">—</b><span>处理项</span></div>
  </div>
  <div class="panel"><h3>磁盘前后对比（橙=清理前占用，绿=释放）</h3><div id="drive-compare"></div></div>
  <div class="panel"><h3>分类战绩（按等级）</h3><div id="by-level"></div></div>
  <div class="panel"><h3>恢复与提示</h3><div id="notes" class="warn"></div></div>
  <div class="panel"><h3>历史会话</h3><div id="history"></div></div>
</main>
<script>
window.FINAL_DATA = /*__FINAL_DATA__*/null;
window.HISTORY_INDEX = /*__HISTORY__*/null;
</script>
<script src="app.js"></script>
<script>
(function () {
  var d = window.FINAL_DATA, hist = window.HISTORY_INDEX;
  if (!d) return;
  var drivesAfter = [].concat(d.drivesAfter || []), drivesBefore = [].concat(d.drivesBefore || []);
  var findings = [].concat(d.findings || []);
  var sessions = [].concat((hist && hist.sessions) || []).slice().reverse();
  document.getElementById('hd-sub').textContent = d.stamp + ' · ' + (d.dryRun ? '演练模式' : '实际执行');
  document.getElementById('st-freed').textContent = fmtBytes(d.freedBytes);
  document.getElementById('st-total').textContent = fmtBytes(hist ? hist.totalFreed : (d.dryRun ? 0 : d.freedBytes));
  document.getElementById('st-count').textContent = findings.filter(function(f) { return !!f.outcome; }).length + ' 项';
  if (d.dryRun) { document.querySelector('#st-freed + span').textContent = '演练预计释放（未删除）'; document.querySelector('#st-count + span').textContent = '演练涉及项'; }

  var cmp = '';
  drivesAfter.forEach(function (a) {
    var b = drivesBefore.filter(function (x) { return x.letter === a.letter; })[0];
    if (!b || !a.total) return;
    var usedB = a.total - b.free, usedA = a.total - a.free;
    var pctB = Math.round(usedB / a.total * 100), pctA = Math.round(usedA / a.total * 100);
    var freedPct = Math.max(0, Math.round((a.free - b.free) / a.total * 100));
    cmp += '<div class="bar-row"><span style="width:32px">' + a.letter + '</span>' +
      '<div class="track"><div class="freed" style="width:' + freedPct + '%"></div>' +
      '<div class="before" style="width:' + Math.min(pctB, 100 - freedPct) + '%"></div></div>' +
      '<span>' + pctB + '% → ' + pctA + '%</span></div>';
  });
  document.getElementById('drive-compare').innerHTML = (d.dryRun ? '<p>演练没有清理文件；磁盘空间可能因其他程序发生变化。</p>' : '') + cmp;

  var rows = '<table><tr><th>等级</th><th>名称</th><th class="num">大小</th><th>结果</th></tr>';
  findings.forEach(function (f) {
    var m = LEVELS[f.level] || { icon: '?', name: '' };
    rows += '<tr><td>' + m.icon + ' L' + f.level + ' ' + m.name + '</td><td>' + escapeHtml(f.name) +
      '</td><td class="num">' + fmtBytes(f.bytes) + '</td><td>' + escapeHtml(({ 'dryrun-delete-permanent':'演练：计划删除', 'dryrun-recycle-bin':'演练：计划移入可恢复区', 'deleted':'已删除', 'quarantined':'已移入可恢复区', 'skipped':'已跳过', 'refused':'已拒绝' })[f.outcome] || f.outcome || '未处理') + '</td></tr>';
  });
  rows += '</table>';
  document.getElementById('by-level').innerHTML = rows;

  document.getElementById('notes').innerHTML =
    '恢复脚本：<code>' + escapeHtml(d.restoreFile || '无（无可恢复项）') + '</code><br>' +
    '审计日志：<code>' + escapeHtml(d.logFile || '—') + '</code>' +
    (d.dryRun ? '<br>⚠ 本次为演练，未实际删除' : '');

  var h = '';
  sessions.forEach(function (s) {
    h += '<div class="session-row"><span>📅 ' + escapeHtml(s.dir) + '</span><span class="num">' + fmtBytes(s.freedBytes) +
      '</span><span>' + escapeHtml(s.reportPath) + '</span></div>';
  });
  document.getElementById('history').innerHTML = h || '<div class="session-row">首次会话</div>';
})();
</script>
</body>
</html>
